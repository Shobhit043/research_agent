name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: assistant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d assistant_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test (SQLite and PostgreSQL)
        # Offline: a scripted fake model replaces Groq, a fake embedder replaces fastembed,
        # and HTTP tools run against canned responses. API tests run once per database backend.
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/assistant_test
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t research-assistant:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -e GROQ_API_KEY=dummy -p 8000:8000 research-assistant:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
